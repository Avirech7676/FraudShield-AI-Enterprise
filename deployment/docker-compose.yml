version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    command: ./deployment/startup.sh
    depends_on:
      - mongodb
    expose:
      - "8000"

  mongodb:
    image: mongo:7
    container_name: fraudshield-prod-db
    restart: always
    volumes:
      - mongo_data:/data/db

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mongo_data:
