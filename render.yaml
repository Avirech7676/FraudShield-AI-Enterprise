services:
  - type: web

    name: fraudshield-api

    runtime: python

    buildCommand: |

      pip install -r requirements.txt

    startCommand: |

      uvicorn app.api.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: MONGODB_URI
        sync: false

      - key: DATABASE_NAME
        sync: false

      - key: JWT_SECRET_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false
