services:
  - type: web

    name: fraudshield-api

    runtime: python

    buildCommand: |

      pip install -r requirements.txt

    startCommand: |

      uvicorn app.api.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: MONGODB_URI
        sync: false

      - key: DATABASE_NAME
        sync: false

      - key: JWT_SECRET_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: MODEL_DIRECTORY
        value: models

      - key: MODEL_VERSION
        value: "2.0"

      - key: DEFAULT_MODEL_VERSION
        value: "2.0"

      - key: LOG_DIRECTORY
        value: logs

      - key: REPORT_DIRECTORY
        value: reports

      - key: RATE_LIMIT_PER_MINUTE
        value: "60"

      - key: API_VERSION
        value: v2
