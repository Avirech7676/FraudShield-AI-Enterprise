version: "3.9"

services:
  api:
    build: .

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000

    ports:
      - "5173:80"

    depends_on:
      - api

  mongodb:
    image: mongo:7

    container_name: fraudshield-db

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
